name: Bump Homebrew Formula

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.10.0)"
        required: true

jobs:
  homebrew:
    runs-on: ubuntu-latest
    steps:
      - name: Bump Homebrew formula
        uses: mislav/bump-homebrew-formula-action@v4.2
        with:
          formula-name: jsongrep
          tag-name: ${{ github.event.release.tag_name || inputs.tag }}
          download-url: https://github.com/${{ github.repository }}/archive/refs/tags/${{ github.event.release.tag_name || inputs.tag }}.tar.gz
        env:
          COMMITTER_TOKEN: ${{ secrets.HOMEBREW_GITHUB_API_TOKEN }}
